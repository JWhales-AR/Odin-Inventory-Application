services:

  postgres:
    image: postgres
    volumes:
      - type: bind
        source: ./src/db/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
    ports:
      - $DB_PORT:5432
    environment:
      POSTGRES_DB: $DB
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASSWORD
